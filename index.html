<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Frog Jump ABC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Shared artwork  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="gPad" cx="35%" cy="30%" r="85%">
        <stop offset="0" stop-color="#8FD463" />
        <stop offset=".6" stop-color="#4FAE45" />
        <stop offset="1" stop-color="#358F3C" />
      </radialGradient>
    </defs>

    <symbol id="lily" viewBox="0 0 100 100">
      <path d="M50 50 L58 4.7 A46 46 0 1 1 42 4.7 Z" fill="url(#gPad)" stroke="#1F6B33" stroke-width="3"
        stroke-linejoin="round" />
      <g stroke="#2E8B3A" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55">
        <path d="M50 50 L84 30" />
        <path d="M50 50 L90 58" />
        <path d="M50 50 L70 88" />
        <path d="M50 50 L30 88" />
        <path d="M50 50 L10 58" />
        <path d="M50 50 L16 30" />
      </g>
      <ellipse cx="33" cy="30" rx="16" ry="7" fill="#fff" opacity=".2" transform="rotate(-30 33 30)" />
    </symbol>

    <symbol id="reed" viewBox="0 0 60 200">
      <path d="M30 200 C14 150 10 110 8 70 C22 110 28 150 30 200Z" fill="#3E9A47" />
      <path d="M30 200 C46 160 52 120 54 84 C40 120 33 160 30 200Z" fill="#4CAF50" />
      <path d="M30 200 C30 150 26 110 30 44" stroke="#2E8B3A" stroke-width="4" fill="none" stroke-linecap="round" />
      <rect x="24" y="14" width="12" height="42" rx="6" fill="#8A5A2B" stroke="#5E3A1A" stroke-width="2" />
      <path d="M30 14 L30 3" stroke="#5E3A1A" stroke-width="2" stroke-linecap="round" />
    </symbol>

    <symbol id="lotus" viewBox="0 0 80 60">
      <g transform="translate(40 54)">
        <ellipse rx="9" ry="26" cy="-24" fill="#FF9DC0" transform="rotate(-62)" />
        <ellipse rx="9" ry="26" cy="-24" fill="#FF9DC0" transform="rotate(62)" />
        <ellipse rx="9" ry="27" cy="-25" fill="#FFB3CF" transform="rotate(-32)" />
        <ellipse rx="9" ry="27" cy="-25" fill="#FFB3CF" transform="rotate(32)" />
        <ellipse rx="9" ry="28" cy="-26" fill="#FFD1E1" />
        <circle cy="-8" r="5" fill="#FFC93C" />
      </g>
    </symbol>

    <!-- Small pond water flower -->
    <symbol id="pondflower" viewBox="0 0 80 70">
      <!-- green water leaves -->
      <ellipse cx="25" cy="57" rx="21" ry="9" fill="#4FAE45" stroke="#2F8F35" stroke-width="2"
        transform="rotate(-15 25 57)" />

      <ellipse cx="55" cy="57" rx="21" ry="9" fill="#5FBA4E" stroke="#2F8F35" stroke-width="2"
        transform="rotate(15 55 57)" />

      <!-- petals -->
      <ellipse cx="40" cy="29" rx="10" ry="22" fill="#FF9DC0" />
      <ellipse cx="40" cy="29" rx="10" ry="22" fill="#FFB3CF" transform="rotate(45 40 29)" />
      <ellipse cx="40" cy="29" rx="10" ry="22" fill="#FFD1E1" transform="rotate(90 40 29)" />
      <ellipse cx="40" cy="29" rx="10" ry="22" fill="#FFB3CF" transform="rotate(135 40 29)" />

      <!-- flower center -->
      <circle cx="40" cy="29" r="8" fill="#FFD34E" />
      <circle cx="40" cy="29" r="3.5" fill="#F0A928" />
    </symbol>


    <!-- Simple floating pond leaf -->
    <symbol id="waterleaf" viewBox="0 0 70 55">
      <path d="M35 27
       C35 13 48 5 62 8
       C60 24 49 39 35 44
       C21 39 10 24 8 8
       C22 5 35 13 35 27Z" fill="#58B94B" stroke="#2F8F35" stroke-width="2.5" />

      <!-- leaf split -->
      <path d="M35 27 L61 9" stroke="#378F3C" stroke-width="2" stroke-linecap="round" />

      <path d="M35 27 L35 43" stroke="#378F3C" stroke-width="2" stroke-linecap="round" />

      <path d="M35 27 L12 10" stroke="#378F3C" stroke-width="2" stroke-linecap="round" />
    </symbol>

    <!-- Cute improved swimming fish -->
    <symbol id="fishart" viewBox="0 0 110 70">
      <!-- Tail -->
      <path d="M28 35 L6 18 L12 35 L6 52 Z" fill="#FF7A59" stroke="#C94E2E" stroke-width="2.8"
        stroke-linejoin="round" />

      <!-- Main body -->
      <ellipse cx="62" cy="35" rx="38" ry="24" fill="#FFB347" stroke="#C94E2E" stroke-width="2.8" />

      <!-- Belly highlight -->
      <ellipse cx="64" cy="44" rx="24" ry="11" fill="#FFE4A8" opacity="0.85" />

      <!-- Top fin -->
      <path d="M52 14 Q64 0 76 16" fill="#FF8B6A" stroke="#C94E2E" stroke-width="2.2" stroke-linejoin="round" />

      <!-- Bottom fin -->
      <path d="M55 55 Q62 66 72 54" fill="#FF8B6A" stroke="#C94E2E" stroke-width="2" stroke-linejoin="round" />

      <!-- Side fin -->
      <path d="M48 38 Q38 28 42 42" fill="#FF9B7A" stroke="#C94E2E" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Eye white -->
      <circle cx="84" cy="28" r="7" fill="#fff" />

      <!-- Eye pupil -->
      <circle cx="86" cy="28" r="3.6" fill="#1A2F38" />

      <!-- Eye shine -->
      <circle cx="87.5" cy="26" r="1.6" fill="#fff" />

      <!-- Smile -->
      <path d="M90 38 Q96 44 102 37" fill="none" stroke="#A04A28" stroke-width="2.2" stroke-linecap="round" />

      <!-- Cheek -->
      <circle cx="78" cy="40" r="4.5" fill="#FF9B9B" opacity="0.55" />

      <!-- Body shine -->
      <ellipse cx="48" cy="24" rx="9" ry="5" fill="#fff" opacity="0.35" transform="rotate(-20 48 24)" />

      <!-- Small bubble -->
      <circle cx="102" cy="18" r="2.8" fill="#fff" opacity="0.7" />
      <circle cx="107" cy="12" r="1.7" fill="#fff" opacity="0.5" />
    </symbol>

    <symbol id="frogart" viewBox="0 0 140 110">
      <ellipse cx="26" cy="97" rx="21" ry="9" fill="#4E8F4A" stroke="#2F5F31" stroke-width="3" />
      <ellipse cx="114" cy="97" rx="21" ry="9" fill="#4E8F4A" stroke="#2F5F31" stroke-width="3" />
      <ellipse cx="70" cy="68" rx="49" ry="38" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
      <ellipse cx="70" cy="79" rx="28" ry="21" fill="#CFE8B4" />
      <circle cx="46" cy="34" r="20" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
      <circle cx="94" cy="34" r="20" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
      <circle cx="46" cy="34" r="14" fill="#fff" />
      <circle cx="94" cy="34" r="14" fill="#fff" />
      <circle cx="48" cy="36" r="7" fill="#1B2B34" />
      <circle cx="92" cy="36" r="7" fill="#1B2B34" />
      <circle cx="50.5" cy="33" r="2.6" fill="#fff" />
      <circle cx="94.5" cy="33" r="2.6" fill="#fff" />
      <circle cx="30" cy="70" r="7" fill="#E9909F" opacity=".75" />
      <circle cx="110" cy="70" r="7" fill="#E9909F" opacity=".75" />
      <circle cx="64" cy="54" r="1.8" fill="#2F5F31" />
      <circle cx="76" cy="54" r="1.8" fill="#2F5F31" />
      <path d="M50 66 Q70 84 90 66" stroke="#24502A" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="44" cy="103" rx="12" ry="6" fill="#4E8F4A" stroke="#2F5F31" stroke-width="2.5" />
      <ellipse cx="96" cy="103" rx="12" ry="6" fill="#4E8F4A" stroke="#2F5F31" stroke-width="2.5" />
    </symbol>

    <symbol id="heartart" viewBox="0 0 32 29">
      <path
        d="M16 28C6 20 1 15 1 8.5 1 4 4.5 1 8.5 1c3 0 5.5 1.6 7.5 4.6C18 2.6 20.5 1 23.5 1 27.5 1 31 4 31 8.5 31 15 26 20 16 28z" />
    </symbol>
  </svg>

  <div class="app">

    <!-- Top bar: lives, title, score -->
    <header class="hud">
      <div class="hearts" id="hearts" role="img" aria-label="Lives">
        <svg class="heart" viewBox="0 0 32 29">
          <use href="#heartart" />
        </svg>
        <svg class="heart" viewBox="0 0 32 29">
          <use href="#heartart" />
        </svg>
        <svg class="heart" viewBox="0 0 32 29">
          <use href="#heartart" />
        </svg>
      </div>
      <h1 class="title">Frog Jump ABC</h1>
      <div class="score" aria-label="Score">
        <svg class="star" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" />
        </svg>
        <span id="scoreValue">0</span>
      </div>
    </header>

    <!-- Listening sign -->
    <section class="sign" id="sign">
      <div class="sun"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <span class="round-label" id="roundLabel">Round 1</span>
      <div class="sign-body">
        <button class="replay-btn" id="replayBtn" type="button" aria-label="Hear the letter again">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
            <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none"
              stroke-linecap="round" />
          </svg>
          <span>Hear it again</span>
        </button>
        <p class="sign-text" id="signText" aria-live="polite">Listen, then tap the letter</p>
      </div>
    </section>

    <!-- Pond / play area -->
    <main class="pond" id="pond">
      <div class="water"></div>
      <div class="bubbles" id="bubbles"></div>

      <svg class="reed reed--l1" aria-hidden="true">
        <use href="#reed" />
      </svg>
      <svg class="reed reed--l2" aria-hidden="true">
        <use href="#reed" />
      </svg>
      <svg class="reed reed--r1" aria-hidden="true">
        <use href="#reed" />
      </svg>
      <svg class="reed reed--r2" aria-hidden="true">
        <use href="#reed" />
      </svg>
      <svg class="lotus lotus--a" aria-hidden="true">
        <use href="#lotus" />
      </svg>
      <svg class="lotus lotus--b" aria-hidden="true">
        <use href="#lotus" />
      </svg>

      <!-- Extra natural pond decorations -->

      <!-- Left side -->
      <svg class="pond-flower pond-flower--left" aria-hidden="true">
        <use href="#pondflower" />
      </svg>

      <svg class="water-leaf water-leaf--left-1" aria-hidden="true">
        <use href="#waterleaf" />
      </svg>

      <svg class="water-leaf water-leaf--left-2" aria-hidden="true">
        <use href="#waterleaf" />
      </svg>


      <!-- Right side -->
      <svg class="pond-flower pond-flower--right" aria-hidden="true">
        <use href="#pondflower" />
      </svg>

      <svg class="water-leaf water-leaf--right-1" aria-hidden="true">
        <use href="#waterleaf" />
      </svg>

      <svg class="water-leaf water-leaf--right-2" aria-hidden="true">
        <use href="#waterleaf" />
      </svg>

      <!-- Swimming fish -->
      <div class="fish-layer" aria-hidden="true">

        <svg class="pond-fish pond-fish--left">
          <use href="#fishart" />
        </svg>

        <svg class="pond-fish pond-fish--right">
          <use href="#fishart" />
        </svg>

        <svg class="pond-fish pond-fish--left-2">
          <use href="#fishart" />
        </svg>

        <svg class="pond-fish pond-fish--right-2">
          <use href="#fishart" />
        </svg>

      </div>

      <div class="pads-row" id="padsRow">
        <button class="pad" type="button"><svg class="pad-art" aria-hidden="true">
            <use href="#lily" />
          </svg><span class="value">A</span></button>
        <button class="pad" type="button"><svg class="pad-art" aria-hidden="true">
            <use href="#lily" />
          </svg><span class="value">B</span></button>
        <button class="pad" type="button"><svg class="pad-art" aria-hidden="true">
            <use href="#lily" />
          </svg><span class="value">C</span></button>
      </div>

      <div class="home-pad"><svg class="pad-art" aria-hidden="true">
          <use href="#lily" />
        </svg></div>

      <div class="frog-wrap" id="frogWrap">
        <svg class="frog" id="frog" viewBox="0 0 140 110" aria-hidden="true">
          <ellipse cx="26" cy="97" rx="21" ry="9" fill="#4E8F4A" stroke="#2F5F31" stroke-width="3" />
          <ellipse cx="114" cy="97" rx="21" ry="9" fill="#4E8F4A" stroke="#2F5F31" stroke-width="3" />
          <ellipse cx="70" cy="68" rx="49" ry="38" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
          <ellipse cx="70" cy="79" rx="28" ry="21" fill="#CFE8B4" />
          <circle cx="46" cy="34" r="20" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
          <circle cx="94" cy="34" r="20" fill="#5FA05A" stroke="#2F5F31" stroke-width="3" />
          <circle cx="46" cy="34" r="14" fill="#fff" />
          <circle cx="94" cy="34" r="14" fill="#fff" />
          <circle class="pupil" cx="48" cy="36" r="7" fill="#1B2B34" />
          <circle class="pupil" cx="92" cy="36" r="7" fill="#1B2B34" />
          <circle cx="50.5" cy="33" r="2.6" fill="#fff" />
          <circle cx="94.5" cy="33" r="2.6" fill="#fff" />
          <circle cx="30" cy="70" r="7" fill="#E9909F" opacity=".75" />
          <circle cx="110" cy="70" r="7" fill="#E9909F" opacity=".75" />
          <circle cx="64" cy="54" r="1.8" fill="#2F5F31" />
          <circle cx="76" cy="54" r="1.8" fill="#2F5F31" />
          <path d="M50 66 Q70 84 90 66" stroke="#24502A" stroke-width="3.5" fill="none" stroke-linecap="round" />
          <ellipse cx="44" cy="103" rx="12" ry="6" fill="#4E8F4A" stroke="#2F5F31" stroke-width="2.5" />
          <ellipse cx="96" cy="103" rx="12" ry="6" fill="#4E8F4A" stroke="#2F5F31" stroke-width="2.5" />
        </svg>
      </div>

      <div class="confetti-layer" id="confettiLayer"></div>
      <div class="feedback" id="feedback"></div>
      <div class="flash" id="flash"></div>
    </main>

    <!-- Bottom bar -->
    <footer class="bottombar">
      <div class="chip" id="streakChip">🔥 <span id="streakValue">Streak 0</span></div>
      <div class="chip">🏆 <span id="bestValue">Best 0</span></div>
      <div class="bottom-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound">
          <svg class="on-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
            <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none"
              stroke-linecap="round" />
          </svg>
          <svg class="off-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
            <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" fill="none"
              stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-btn" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </footer>

  </div>

  <!-- Start screen (needed so the browser allows sound and speech) -->
  <div class="overlay show" id="startOverlay">
    <div class="card">
      <svg class="card-frog" viewBox="0 0 140 110" aria-hidden="true">
        <use href="#frogart" />
      </svg>
      <h2>Frog Jump ABC</h2>
      <p>Listen to the letter, then tap the lily pad that matches.</p>
      <button id="startBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.5v15l13-7.5z" fill="currentColor" />
        </svg>
        Start playing
      </button>
    </div>
  </div>

  <!-- Game over -->
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="card-emoji" aria-hidden="true">💦</div>
      <h2>Out of lives</h2>
      <p class="big" id="finalScore">Score 0</p>
      <p id="finalBest">Best 0</p>
      <button id="playAgainBtn" type="button">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
